name: mess_and_gags

services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # Loopback only: these were published on 0.0.0.0, so every datastore was reachable from
      # the local network with the credentials in src/.env. Bound to 127.0.0.1 they stay usable
      # from database tools on this machine and nowhere else.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    restart: always
    # Redis carries the entire message fan-out, the access-token denylist and the Celery broker.
    # Unauthenticated, anyone who can reach it can publish forged events into any user's channel,
    # clear the denylist, or queue arbitrary Celery tasks — so it needs a password, and it does
    # not need to be reachable from outside the compose network at all.
    #
    # `noeviction` rather than an LRU policy on purpose: under memory pressure an evicting Redis
    # would silently drop `blacklist:` and `force_logout:` keys, which quietly un-revokes logged
    # out sessions. Failing writes loudly is the correct behaviour for a key store that security
    # decisions depend on.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in src/.env}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      # Loopback only. nginx on 4200 is the single origin the browser uses, and it is where
      # the security headers and the first layer of rate limiting live — reaching the API
      # directly from the network would bypass both. Swagger still works at localhost:8000/docs.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    # --no-access-log: uvicorn's default access logger writes the full request path — including
    # the invite-link token in `/invite-links/{token}` — verbatim to stdout, which `docker compose
    # logs` captures. `app.main`'s own `log_requests` middleware already logs every
    # request/response with loguru and redacts that token, so uvicorn's separate, unredacted
    # access log is disabled here rather than patched.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-production}
    restart: always
    ports:
      - "4200:80"
    environment:
      # nginx proxies /api and /ws to the api service, so the browser sees a single origin and
      # the auth cookies stay same-site.
      - API_URL=/api/
      - WS_URL=/ws
    depends_on:
      - api

  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./api/.env
    depends_on:
      - redis
      - postgres
    restart: always

  celery-beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - ./api/.env
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data: