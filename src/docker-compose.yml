name: mess_and_gags

services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # Loopback only: these were published on 0.0.0.0, so every datastore was reachable from
      # the local network with the credentials in src/.env. Bound to 127.0.0.1 they stay usable
      # from database tools on this machine and nowhere else.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    restart: always
    # Redis carries the access-token denylist, force-logout cutoffs, OTPs, rate limits, presence and
    # the Celery broker. WebSocket events are NOT here any more: see `redis-events`.
    # Unauthenticated, anyone who can reach it can publish forged events into any user's channel,
    # clear the denylist, or queue arbitrary Celery tasks — so it needs a password, and it does
    # not need to be reachable from outside the compose network at all.
    #
    # `noeviction` rather than an LRU policy on purpose: under memory pressure an evicting Redis
    # would silently drop `blacklist:` and `force_logout:` keys, which quietly un-revokes logged
    # out sessions. Failing writes loudly is the correct behaviour for a key store that security
    # decisions depend on.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in src/.env}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Event traffic (WebSocket fan-out, per-user streams, replay cursors) lives here, apart from
  # `redis`. The two have opposite requirements: `redis` holds the token denylist and must never
  # evict or lose a key, while event streams are a bounded, disposable cache that must evict
  # under pressure instead of failing writes. Sharing one instance made streams compete with
  # `blacklist:` keys for a noeviction budget.
  #
  # No persistence on purpose (`--save ""`, no AOF): a restart empties it, every client then gets
  # `resync_required` and reloads over HTTP, and deleted content cannot outlive its TTL on disk.
  redis-events:
    image: redis:8-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${EVENTS_REDIS_PASSWORD:?EVENTS_REDIS_PASSWORD must be set in src/.env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${EVENTS_REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO's dev volume ended up in a broken state (objects missing independent of any app bug),
  # so the object store is RustFS instead. It speaks the same S3 API `minio_manager`
  # (app/infrastructure/minio.py) already talks over aiobotocore, so this is an endpoint/credential
  # swap, not an application-code rewrite — the Python client class is still named `MinioClient`.
  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_USER}
      RUSTFS_SECRET_KEY: ${MINIO_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    # RustFS runs as non-root uid 10001 inside the container. A fresh named Docker volume is
    # usually fine (Docker initialises it with the image's filesystem permissions on first use),
    # but if this container fails to start with a permissions error on /data, that uid/ownership
    # mismatch is the first thing to check.

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      # Loopback only. The gateway container on 4200 is the single origin the browser uses, and
      # it is where the security headers and the first layer of rate limiting live — reaching
      # the API directly from the network would bypass both. Swagger still works at
      # localhost:8000/docs.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      redis-events:
        condition: service_healthy
      rustfs:
        condition: service_started
    # --no-access-log: uvicorn's default access logger writes the full request path — including
    # the invite-link token in `/invite-links/{token}` — verbatim to stdout, which `docker compose
    # logs` captures. `app.main`'s own `log_requests` middleware already logs every
    # request/response with loguru and redacts that token, so uvicorn's separate, unredacted
    # access log is disabled here rather than patched.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-production}
    restart: always
    # No `ports:` here — this container is internal-only now. The gateway service is the single
    # published entry point on 4200 and is the only thing that reaches this one, over the compose
    # network.
    environment:
      # Still relative: the browser's requests go through the gateway regardless of which
      # container actually answers them, so the auth cookies stay same-site either way.
      - API_URL=/api/
      - WS_URL=/ws
    depends_on:
      - api

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      # The single published entry point. nginx here owns security headers, rate limiting, and
      # all /api, /ws and /objects routing — the frontend container no longer does either of
      # those jobs, it only serves the Angular build, and it is reached only from here.
      - "4200:80"
    depends_on:
      - frontend
      - api
      - rustfs

  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./api/.env
    depends_on:
      - redis
      - postgres
    restart: always

  celery-beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - ./api/.env
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rustfs_data: