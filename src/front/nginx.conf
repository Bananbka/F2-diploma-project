# Rate limit zones must be declared at http scope; this file is included from there.
#
# These are a coarse backstop in front of the application's own per-account limits, not a
# replacement for them: nginx can only see an address, so it cannot tell one account's attempts
# from another's behind the same NAT.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # The API caps attachments at 50 MB, but nginx's default `client_max_body_size` is 1 MB — so
    # every upload over 1 MB was rejected at the proxy and the application limit was unreachable.
    client_max_body_size 55m;

    server_tokens off;

    # Security headers on every response.
    #
    # The CSP matters more here than in an ordinary app: unlocked identity keys live in this
    # page's memory, so script injection is not "an XSS" but a total compromise of the end-to-end
    # guarantee. `connect-src 'self'` also keeps a successful injection from posting key material
    # anywhere off-origin.
    #
    # 'wasm-unsafe-eval' is required by the Argon2 build used for the unlock KDF. 'unsafe-inline'
    # for styles is Angular's runtime style injection; scripts deliberately do not get it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Enable once TLS terminates here. Sending HSTS over plain HTTP is ignored by browsers, and
    # turning it on before certificates exist would lock users out of a working deployment.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Runtime config must never be cached, or a redeploy pointing at a new backend would be
    # ignored by browsers still holding the old file.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # The app shell must never be cached. Its <script> tags name content-hashed chunks, so a stale
    # index.html asks for chunk hashes that no longer exist after a redeploy — and with the SPA
    # fallback below those 404s come back as index.html with a text/html type, which the browser
    # rejects as a corrupted module rather than as a missing file.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed build output is immutable by construction. The Angular application builder emits it at
    # the document root (main-*.js, chunk-*.js, styles-*.css), not under /assets/.
    #
    # `=404` matters as much as the caching does: a missing bundle has to fail as a 404. Letting it
    # fall through to index.html turns a plainly diagnosable deploy problem into a MIME-type error.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy the API so the browser sees one origin. That keeps the auth cookies same-site rather
    # than cross-site, which is what allows SameSite=Lax to work at all.
    # Credential endpoints get their own, far tighter bucket. The application rate-limits these
    # too; this is the layer that stops a flood before it reaches Python at all.
    location ~ ^/api/auth/(login|register|verify-email|forgot-password|reset-password) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: the application reads the first entry as the client address,
        # so a client-supplied X-Forwarded-For header must not be allowed to prepend a fake one.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large attachment uploads and downloads stream through here.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback for navigation only. There is deliberately no blanket `error_page 404 /index.html`:
    # that would resurrect the same masking problem for every asset type not matched above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
