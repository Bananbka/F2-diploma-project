server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config must never be cached, or a redeploy pointing at a new backend would be
    # ignored by browsers still holding the old file.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # The app shell must never be cached. Its <script> tags name content-hashed chunks, so a stale
    # index.html asks for chunk hashes that no longer exist after a redeploy — and with the SPA
    # fallback below those 404s come back as index.html with a text/html type, which the browser
    # rejects as a corrupted module rather than as a missing file.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed build output is immutable by construction. The Angular application builder emits it at
    # the document root (main-*.js, chunk-*.js, styles-*.css), not under /assets/.
    #
    # `=404` matters as much as the caching does: a missing bundle has to fail as a 404. Letting it
    # fall through to index.html turns a plainly diagnosable deploy problem into a MIME-type error.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy the API so the browser sees one origin. That keeps the auth cookies same-site rather
    # than cross-site, which is what allows SameSite=Lax to work at all.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback for navigation only. There is deliberately no blanket `error_page 404 /index.html`:
    # that would resurrect the same masking problem for every asset type not matched above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
