@if (!isOnline()) {
    <!-- Reconnecting is its own state: messages sent while the socket is down still go over HTTP,
         but nothing new will arrive until it comes back. -->
    <div
        class="offline"
        role="status"
    >
        <lucide-icon [img]="wifiOffIcon" />
        Reconnecting…
    </div>
}

<div class="layout">
    <app-navigation-rail
        class="rail"
        [filter]="filter()"
        (filterChange)="filter.set($event)"
        (securityRequested)="openSecurity()"
    />

    <app-resizable-panel
        class="sidebar"
        [class.is-hidden-narrow]="showConversationOnly()"
        storageKey="chat-sidebar"
        [minWidth]="256"
        [maxWidth]="512"
        [defaultWidth]="320"
        [disabled]="isNarrow()"
    >
        <app-chat-sidebar [filter]="filter()" />
    </app-resizable-panel>

    <main
        class="conversation"
        [class.is-hidden-narrow]="!showConversationOnly()"
    >
        <router-outlet />
    </main>

    @if (panelOpen() && activeChatId(); as chatId) {
        <app-chat-panel [chatId]="chatId" />
    }
</div>
