@if (!isOnline()) {
    <!-- Reconnecting is its own state: messages sent while the socket is down still go over HTTP,
         but nothing new will arrive until it comes back. -->
    <div
        class="offline"
        role="status"
    >
        <lucide-icon [img]="wifiOffIcon" />
        Reconnecting…
    </div>
}

<div class="layout">
    <app-navigation-rail
        class="rail"
        [view]="view()"
        [contactsActive]="contactsOpen()"
        (viewChange)="selectView($event)"
        (contactsRequested)="contactsOpen.set(true)"
    />

    <app-resizable-panel
        class="sidebar"
        [class.is-hidden-narrow]="showConversationOnly()"
        storageKey="chat-sidebar"
        [minWidth]="256"
        [maxWidth]="512"
        [defaultWidth]="320"
        [disabled]="isNarrow()"
    >
        <!-- Hidden rather than removed while Contacts is showing, so the list keeps its search and scroll. -->
        <app-chat-sidebar
            [hidden]="contactsOpen()"
            [view]="view()"
        />
        @if (contactsOpen()) {
            <app-contacts-list />
        }
    </app-resizable-panel>

    <main
        class="conversation"
        [class.is-hidden-narrow]="!showConversationOnly()"
    >
        <router-outlet />
    </main>

    @if (panelOpen() && activeChatId(); as chatId) {
        <app-chat-panel [chatId]="chatId" />
    }
</div>

@switch (createDialog()) {
    @case ('group') {
        <app-create-group />
    }
    @case ('channel') {
        <app-create-channel />
    }
}

@if (infoDialog.chatId(); as infoChatId) {
    <app-info-dialog
        [chatId]="infoChatId"
        (closed)="infoDialog.close()"
    />
}

<app-media-viewer />
