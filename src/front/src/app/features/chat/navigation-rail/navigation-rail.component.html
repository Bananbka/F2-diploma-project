<app-brand-mark
    class="mark"
    [showName]="false"
/>

<nav
    class="tabs"
    aria-label="Chat views"
>
    @for (item of systemItems(); track item.key) {
        <button
            type="button"
            class="rail-button"
            [class.is-active]="view() === item.key && !contactsActive()"
            [attr.aria-current]="view() === item.key && !contactsActive() ? 'page' : null"
            [attr.aria-label]="labelFor(item)"
            [title]="item.label"
            (click)="select(item.key)"
        >
            <lucide-icon [img]="item.icon!" />
            @if (item.unread > 0) {
                <span
                    class="badge"
                    aria-hidden="true"
                    >{{ badgeText(item.unread) }}</span
                >
            }
        </button>
    }

    <button
        type="button"
        class="rail-button"
        [class.is-active]="contactsActive()"
        [attr.aria-current]="contactsActive() ? 'page' : null"
        aria-label="Contacts"
        title="Contacts"
        (click)="contactsRequested.emit()"
    >
        <lucide-icon [img]="contactsIcon" />
    </button>

    <hr
        class="divider"
        aria-hidden="true"
    />

    @for (item of folderItems(); track item.key) {
        <button
            type="button"
            class="rail-button"
            [class.is-active]="view() === item.key && !contactsActive()"
            [attr.aria-current]="view() === item.key && !contactsActive() ? 'page' : null"
            [attr.aria-label]="'Folder ' + labelFor(item)"
            [title]="item.label"
            [appContextMenu]="folderMenu(item.folder!)"
            (click)="select(item.key)"
        >
            <lucide-icon [img]="item.icon!" />
            @if (item.unread > 0) {
                <span
                    class="badge"
                    aria-hidden="true"
                    >{{ badgeText(item.unread) }}</span
                >
            }
        </button>
    }

    <button
        type="button"
        class="rail-button"
        aria-label="New folder"
        title="New folder"
        (click)="openFolderDialog()"
    >
        <lucide-icon [img]="plusIcon" />
    </button>
</nav>

<div class="foot">
    <!-- One tap from anywhere: the safety number is the only defence against a substituted key, so
         burying it would undermine the guarantee it exists to protect. -->
    <button
        type="button"
        class="rail-button"
        title="Safety number"
        (click)="securityRequested.emit()"
    >
        <lucide-icon [img]="shieldIcon" />
        <span class="sr-only">Safety number</span>
    </button>

    <button
        type="button"
        class="rail-button"
        title="Settings"
        data-settings-trigger
        (click)="openSettings('profile', $event)"
    >
        <lucide-icon [img]="settingsIcon" />
        <span class="sr-only">Settings</span>
    </button>

    <div class="account">
        <button
            #accountTrigger
            type="button"
            class="account-trigger"
            [attr.aria-expanded]="menuOpen()"
            (click)="menuOpen.set(!menuOpen())"
        >
            <app-avatar
                size="sm"
                [name]="user()?.full_name ?? 'You'"
                [seed]="user()?.id ?? ''"
                [imageUrl]="user()?.avatar_url ?? null"
            />
            <span class="sr-only">Account</span>
        </button>

        @if (menuOpen()) {
            <div
                class="menu"
                role="menu"
            >
                <p class="menu-head">
                    <span class="menu-name">{{ user()?.full_name }}</span>
                    <span class="menu-username">&#64;{{ user()?.username }}</span>
                </p>
                <button
                    type="button"
                    role="menuitem"
                    class="menu-item"
                    (click)="openSettings('profile', accountTrigger)"
                >
                    <lucide-icon [img]="userIcon" />
                    Edit profile
                </button>
                <button
                    type="button"
                    role="menuitem"
                    class="menu-item"
                    (click)="openSettings('security', accountTrigger)"
                >
                    <lucide-icon [img]="keyIcon" />
                    Change password
                </button>
                <button
                    type="button"
                    role="menuitem"
                    class="menu-item is-danger"
                    (click)="signOut()"
                >
                    <lucide-icon [img]="logOutIcon" />
                    Sign out
                </button>
            </div>
        }
    </div>
</div>

@if (folderDialog(); as dialog) {
    <app-folder-edit-dialog
        [folder]="dialog.folder"
        [focus]="dialog.focus"
        [chats]="chats()"
        (closed)="folderDialog.set(null)"
    />
}
