@if (deleted()) {
    <span
        class="face monogram is-deleted"
        aria-hidden="true"
    >
        <lucide-icon
            [img]="deletedIcon"
            class="hash"
        />
    </span>
    <span class="sr-only">{{ name() }}</span>
} @else if (imageUrl()) {
    <img
        class="face"
        [src]="imageUrl()"
        [alt]="name()"
    />
} @else {
    <span
        class="face monogram"
        [style.background-color]="color()"
        aria-hidden="true"
    >
        @if (monogram()) {
            {{ monogram() }}
        } @else {
            <lucide-icon
                [img]="kind() === 'channel' ? hashIcon : usersIcon"
                class="hash"
            />
        }
    </span>
    <span class="sr-only">{{ name() }}</span>
}

@if (online() !== undefined) {
    <span
        class="presence"
        [class.is-online]="online()"
    >
        <span class="sr-only">{{ online() ? 'Online' : 'Offline' }}</span>
    </span>
}
