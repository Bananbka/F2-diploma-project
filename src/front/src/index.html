<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Messenger</title>
        <base href="/" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <link
            rel="icon"
            type="image/x-icon"
            href="favicon.ico"
        />
        <!-- The design specifies Inter for UI and JetBrains Mono for key material. Safety numbers
             and fingerprints are compared digit by digit, so a monospace face with disambiguated
             0/O and 1/l is a correctness concern, not a stylistic one. -->
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        />
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
