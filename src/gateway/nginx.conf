# Rate limit zones must be declared at http scope; this file is included from there.
#
# These are a coarse backstop in front of the application's own per-account limits, not a
# replacement for them: nginx can only see an address, so it cannot tell one account's attempts
# from another's behind the same NAT.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

# Key for the credential-endpoint bucket: the client address for those paths, empty (not limited by
# this zone) for everything else under /api/auth/ such as refresh and logout. Matched against
# $uri as the limiter sees it: after the location's `rewrite` has stripped `/api` (rewrite-phase
# directives run before limit_req) and after nginx has normalised the path, so encoded or
# doubled-slash spellings of a credential path cannot dodge the limit.
map $uri $auth_limit_key {
    default "";
    ~^/auth/(?:login|register|verify-email|forgot-password|reset-password)/?$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=api_auth:10m rate=1r/s;

server {
    listen 80;

    server_tokens off;

    # The API caps attachments at 50 MB, but nginx's default `client_max_body_size` is 1 MB — so
    # every upload over 1 MB was rejected at the proxy and the application limit was unreachable.
    client_max_body_size 55m;

    # Docker's embedded DNS resolver. A plain `proxy_pass http://api:8000;` resolves the hostname
    # once, at config load, and then caches that IP forever — so when a backend container is
    # recreated (which gets a new internal IP every time) nginx keeps proxying to the stale IP and
    # every request starts 502ing until nginx itself is restarted. This bit this project for real:
    # the `/objects/` proxy to rustfs broke exactly this way after rustfs was recreated, and the
    # only fix at the time was manually restarting the proxying container.
    #
    # The fix is this resolver plus using a variable (not a literal) in every `proxy_pass` below —
    # a variable forces nginx to re-resolve the hostname through this resolver on the configured
    # TTL instead of caching the IP at startup. `valid=10s` caps how stale the IP can get after a
    # backend is recreated. `ipv6=off` because the compose network here is IPv4-only; leaving IPv6
    # on just means a wasted, always-failing AAAA lookup per resolution.
    #
    # This also means the gateway is already load-balancing-ready: if `api` is ever scaled
    # (`docker compose up --scale api=N`), Docker's embedded DNS round-robins the `api` hostname
    # across the N container IPs, and this resolver-based proxy_pass picks up one of them per
    # request (rotating on each `valid` interval) with no further nginx config change.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers. Kept in an include because nginx `add_header` does not inherit into a
    # location that sets any header of its own — see the comment at the top of that file. This is
    # the only hop that ever talks to the browser, so this is the only place these headers are set.
    include /etc/nginx/security-headers.conf;

    # `limit_req_status 429` below makes nginx answer with its own HTML page, which breaks clients
    # that parse every API error as the ErrorResponse JSON the application itself returns. Rewrite
    # it to the same shape. This only fires for nginx-generated 429s: upstream responses are not
    # intercepted (no proxy_intercept_errors), so the application's own 429 keeps its body and its
    # exact Retry-After.
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        # Own add_header means no inheritance of the server-level ones; re-include them.
        include /etc/nginx/security-headers.conf;
        return 429 '{"status":"error","error_code":"RATE_LIMITED","message":"Too many requests. Please slow down.","details":{"retry_after_seconds":1}}';
    }

    # The two blocks below proxy the API so the browser sees one origin. That keeps the auth
    # cookies same-site rather than cross-site, which is what allows SameSite=Lax to work at all.
    #
    # Credential endpoints get their own, far tighter bucket. The application rate-limits these
    # too; this is the layer that stops a flood before it reaches Python at all.
    #
    # This used to be a regex location, which never ran: nginx stops at a `^~` prefix match without
    # consulting regex locations, and `location ^~ /api/` below always matches first, so these
    # endpoints silently got only the general bucket. Instead the tight zone is keyed through a map
    # (see `$auth_limit_key` at the top of this file) that is empty — and therefore unlimited — for
    # every path except the credential ones, so one `^~ /api/auth/` block can apply both buckets.
    location ^~ /api/auth/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        # See the `/api/` block below for why the prefix is stripped by hand, and why `set` has to
        # come before `rewrite ... break;`.
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: the application reads the first entry as the client address,
        # so a client-supplied X-Forwarded-For header must not be allowed to prepend a fake one.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Invite-link routes carry the token as the whole address of the preview endpoint
    # (`GET /invite-links/{token}`) — genuinely a URL, since the point is a clickable, shareable
    # link. `access_log off` here keeps that 256-bit credential out of nginx's own logs, which
    # would otherwise record the full proxied URI on every hit. Join and revoke put their token in
    # the request body instead (see `invite_link_routes.py`) precisely so they don't need this,
    # but the whole `/invite-links/` namespace is small and token-adjacent enough that turning
    # logging off for all of it is simpler than splitting hairs between the three routes.
    location ^~ /api/invite-links/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        access_log off;

        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # `^~` is required here, not optional style. Message-attachment object keys carry the
    # original file extension (see `minio_manager.upload_file`), so a path like
    # `/api/files/attachments/{chat_id}/{uuid}.jpg` also matches the asset-caching regex that
    # lives in the frontend container's own config. Without `^~`, nginx falls through from this
    # prefix location to checking regex locations once it reaches this point in matching, and a
    # request meant for the API could instead fall through to the SPA fallback below. `^~` tells
    # nginx this prefix match is final, so every `/api/*` request is proxied regardless of
    # extension.
    #
    # The explicit `rewrite` + bare `proxy_pass` (no trailing-slash URI) is required here, not a
    # style choice: nginx's usual trick of stripping a matched prefix via `proxy_pass
    # http://host/;` only works when `proxy_pass` is a literal. The moment `proxy_pass` takes a
    # variable (needed for the resolver-based re-resolution above), that prefix-stripping stops
    # happening and the *entire original URI*, `/api/...` included, is forwarded verbatim — which
    # 404s against FastAPI, whose routes don't carry the `/api` prefix. This cost a real debugging
    # cycle while building this gateway: `/api/docs` and `/objects/...` both came back 404/403
    # until the rewrite was added back here to do the stripping explicitly. `set` has to come
    # before `rewrite ... break;` for the same reason noted on the auth block above — `break`
    # stops a `set` written after it from ever running.
    location ^~ /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;

        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large attachment uploads and downloads stream through here.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Avatars and stickers are public-read RustFS objects, built as `{base}/{bucket}/{key}` by
    # MinioClient.upload_file (see app/infrastructure/minio.py). Proxying them under this origin
    # (rather than naming RustFS's own host:port in MINIO_PUBLIC_URL) keeps them same-origin so the
    # CSP's `img-src 'self'` / `media-src 'self'` cover them with no external host ever added to
    # the policy. `^~` is required for the same reason as `/api/` above: object keys carry
    # extensions (`.jpg`, `.webp`, ...) that also match the frontend's asset-caching regex, and
    # without `^~` that regex could win and the request would never reach rustfs.
    location ^~ /objects/ {
        # See the comment on the `/api/` block above: with a variable `proxy_pass`, nginx forwards
        # the request URI unmodified instead of stripping the matched location prefix, so the
        # `/objects/` prefix has to be stripped explicitly or RustFS gets a path with a bucket
        # name that doesn't exist. `set` comes before `rewrite ... break;` for the same reason
        # noted on the `/api/` block above.
        set $rustfs_upstream http://rustfs:9000;
        rewrite ^/objects/(.*)$ /$1 break;

        proxy_pass $rustfs_upstream;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # This location sets its own header (Cache-Control above), which means it does NOT
        # inherit the server-level security headers — `add_header` inheritance is all-or-nothing,
        # see the comment at the top of security-headers.conf. Re-include it explicitly or every
        # avatar/sticker response goes out with no CSP, no X-Frame-Options, nothing.
        include /etc/nginx/security-headers.conf;
    }

    location /ws {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Everything else — `/config.json`, `/index.html`, hashed build output, and the SPA fallback
    # for client-side routes — is proxied straight through to the frontend container, which owns
    # none of the routing decisions above and exists purely to serve the Angular build.
    #
    # Deliberately no `/config.json` or `/index.html` location here of its own: those still need
    # `Cache-Control: no-store` (a stale index.html asks for content-hashed chunks that no longer
    # exist after a redeploy, and the runtime config must never be stale either), but that rule
    # lives once, in `src/front/nginx.conf`, and is passed through unmodified by this catch-all.
    # Setting it a second time here would duplicate the header the same way a second
    # `Content-Security-Policy` would — proxy_pass already forwards upstream response headers by
    # default, so there is no need to (and must not) re-add it.
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
