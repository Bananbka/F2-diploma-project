# Security headers, kept in one file because nginx's `add_header` does NOT inherit.
#
# This is the trap: directives from an outer block are inherited by an inner one **only if the
# inner block sets none of its own**. Several locations here set their own `Cache-Control`, which
# silently discarded every security header declared at server level — including on `/index.html`,
# the document that loads and runs the app, and therefore the one place the CSP actually matters.
# `location /` was affected too, because its SPA fallback internally rewrites to `/index.html`.
#
# So this file is `include`d into the server block *and* into every location that adds a header of
# its own. If you add such a location, include this in it as well.
#
# This file lives in the gateway container, not the frontend container. The gateway is the only
# hop that ever talks to the browser now — frontend sits behind it and is reached only by the
# gateway over the compose network — so this is the single place these headers are set. Setting
# them a second time on the inner (frontend) hop would be a real bug, not harmless redundancy: the
# browser enforces the INTERSECTION of two same-named CSP headers, which can silently break
# something that was fine under either policy alone.
#
# The CSP matters more here than in an ordinary app: unlocked identity keys live in the page's
# memory, so script injection is not "an XSS" but a total compromise of the end-to-end guarantee.
# `connect-src 'self'` also stops a successful injection posting key material off-origin.
#
# 'unsafe-inline' for styles is Angular's runtime component-style injection. Scripts deliberately
# do not get it, and there is no 'wasm-unsafe-eval' either: the Argon2 used for unlock is
# `@noble/hashes`, which is pure JavaScript and ships no WebAssembly, so allowing it would have
# been a relaxation bought for nothing. `blob:` is allowed in `img-src` and `media-src` (but
# nowhere else — script-src and connect-src do not get it) because decrypted attachment bytes
# never touch the network, not even a same-origin endpoint: the plaintext exists only in page
# memory after decryption, and `URL.createObjectURL()` is the only way to hand already-decrypted
# image/video/audio bytes to an `<img>`/`<video>`/`<audio>` element without writing them through a
# `data:` URL (impractical for anything but small files) or a round trip through the server (which
# would mean decrypting to disk or re-uploading plaintext). The safety-number QR code remains a
# `data:` URL and needs no `blob:` allowance of its own.
#
# Two things had to be reconciled with a strict script-src, and both broke the app outright the
# first time this shipped:
#
#   * Angular's `inlineCritical` optimisation emits
#     `<link rel="stylesheet" media="print" onload="this.media='all'">`. That `onload` is an inline
#     event handler, so a strict script-src blocks it, the media query is never switched away from
#     `print`, and **the entire global stylesheet silently never applies**. It is turned off in
#     angular.json rather than allowed here — 'unsafe-inline' on scripts would give up the one
#     protection that actually matters for a page holding unlocked identity keys.
#
#   * Inter and JetBrains Mono are self-hosted (see src/styles/_fonts.scss), which is why no
#     external origin appears below at all. They were loaded from Google, which meant naming
#     fonts.googleapis.com and fonts.gstatic.com here — and every host named in a CSP is a host
#     that can serve script to this page if it is ever compromised or hijacked by DNS. It also
#     announced each user's IP and visit time to a third party, which is a poor fit for an
#     application arguing that not even its own server learns anything.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Enable once TLS terminates here. Sending HSTS over plain HTTP is ignored by browsers, and
# turning it on before certificates exist would lock users out of a working deployment.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
